name: Android release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: |
            app/src/main/assets/debian.zip
            app/src/main/assets/runtime.json
            app/src/main/jniLibs
            .runtime/rootfs
          key: debian-trixie-v1-${{ hashFiles('tools/prepare_runtime.py', 'third_party/runtime/**') }}
      - name: Build offline Debian entirely on GitHub runner
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo python3 tools/prepare_runtime.py --chroot
          sudo chown -hR "$USER:$USER" app/src/main/assets app/src/main/jniLibs .runtime/rootfs
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: |
            app/src/main/assets/debian.zip
            app/src/main/assets/runtime.json
            app/src/main/jniLibs
            .runtime/rootfs
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Record offline runtime digests
        run: python3 tools/runtime_bundle.py create .delivery/derminal-runtime-arm64-v1.zip
      - name: Compile ARM64 PTY with NDK
        run: sh tools/build_native.sh
      - name: Restore stable signing identity
        env:
          DERMINAL_KEYSTORE_BASE64: ${{ secrets.DERMINAL_KEYSTORE_BASE64 }}
        run: |
          test -n "$DERMINAL_KEYSTORE_BASE64"
          printf '%s' "$DERMINAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/derminal.p12"
          echo "DERMINAL_KEYSTORE_PATH=$RUNNER_TEMP/derminal.p12" >> "$GITHUB_ENV"
      - name: Tests, lint, optimized signed build
        env:
          DERMINAL_BUILD_NUMBER: ${{ github.run_number }}
          DERMINAL_SIGNING_PASSWORD: ${{ secrets.DERMINAL_SIGNING_PASSWORD }}
        run: gradle --no-daemon :terminal-emulator:testReleaseUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Collect corresponding sources on GitHub runner
        run: sudo python3 tools/collect_sources.py --chroot
      - name: Verify and package
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/derminal-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/derminal-arm64.apk > delivery/derminal-signature.txt
          sha256sum delivery/derminal-arm64.apk > delivery/derminal-arm64.apk.sha256
          cp app/build/outputs/mapping/release/mapping.txt delivery/derminal-mapping.txt
          cp app/src/main/assets/runtime.json delivery/derminal-runtime.json
          cp runtime-lock.json delivery/derminal-runtime-lock.json
          cp .delivery/derminal-runtime-sources.tar.gz delivery/
          python3 tools/release_metadata.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DERMINAL_TAG="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$DERMINAL_TAG" --target "$GITHUB_SHA" --title "derminal 1.0.0 (${GITHUB_RUN_NUMBER})" --notes-file docs/release-notes.md
          gh release upload "$DERMINAL_TAG" delivery/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-reports
          path: |
            app/build/reports/
            terminal-emulator/build/reports/
          retention-days: 14
